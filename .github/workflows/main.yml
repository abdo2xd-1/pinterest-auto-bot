name: Pinterest Auto Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# إعطاء صلاحية للكود لكي يرفع التحديثات (ملف السجل) إلى المستودع
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: python main.py

      - name: Commit and push history
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          touch history.txt
          git add history.txt
          git commit -m "Update history.txt with new generated pin" || echo "No changes to commit"
          git push
